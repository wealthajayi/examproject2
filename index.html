<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <div id="head">
        <span id="score">SCORE 0</span>
        <span id="high">HIGH 0</span>
        <span id="lives">●●●</span>
    </div>

    <canvas id="game" width="400" height="500"></canvas>

    <div id="pad">
        <button id="up" aria-label="Up">↑</button>
        <button id="right" aria-label="Right">→</button>
        <button id="left" aria-label="Left">←</button>
        <button id="down" aria-label="Down">↓</button>
    </div>

    <div id="help">Use arrows to control your sprite</div>
    <script src="index.js"></script>
</body>
</html>
